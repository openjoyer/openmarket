cart:
  ttl: 30d
  max-items: 100
  max-quantity-per-item: 50

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

spring:
  application:
    name: cart-service
  data:
    redis:
      host: redis
      port: 6379
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          enabled: false
server:
  port: 8080
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true