name: CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Resolve the commit range to diff against (PR base, or previous push tip).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            RANGE="origin/${BASE_REF}...HEAD"
          else
            git fetch --quiet origin "$DEFAULT_BRANCH" || true
            if [ -z "${BEFORE_SHA:-}" ] \
               || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || git rev-parse HEAD~1)
            else
              BASE="$BEFORE_SHA"
            fi
            RANGE="${BASE}..HEAD"
          fi

          CHANGED=$(git diff --name-only "$RANGE")
          echo "Diff range: $RANGE"
          echo "Changed files:"; echo "$CHANGED"

          # The shared contracts module triggers rebuilds of every service that consumes it.
          CONTRACTS_CHANGED=false
          if echo "$CHANGED" | grep -q '^contracts/'; then
            CONTRACTS_CHANGED=true
          fi
          echo "contracts changed: $CONTRACTS_CHANGED"

          # Auto-discover services: any services/<name> with a Dockerfile and a gradle wrapper.
          SERVICES=()
          for dir in services/*/; do
            svc=$(basename "$dir")
            [ -f "${dir}Dockerfile" ] || continue
            [ -f "${dir}gradlew" ] || continue

            if echo "$CHANGED" | grep -q "^services/${svc}/"; then
              SERVICES+=("$svc")
            elif [ "$CONTRACTS_CHANGED" = true ] \
                 && grep -qs 'includeBuild("../../contracts")' "${dir}settings.gradle.kts"; then
              SERVICES+=("$svc")
            fi
          done

          if [ ${#SERVICES[@]} -eq 0 ]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -cs .)
          fi

          echo "Detected services: $JSON"
          echo "services=$JSON" >> "$GITHUB_OUTPUT"
          echo "matrix={\"service\":$JSON}" >> "$GITHUB_OUTPUT"

  test-unit:
    name: Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Run Unit Tests
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          retention-days: 7

  build-push:
    name: Build & Push Images
    needs: [detect-changes, test-unit]
    if: github.event_name == 'push' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-contexts: |
            contracts=contracts
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openmarket/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/openmarket/${{ matrix.service }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: [detect-changes, build-push]
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'develop') && vars.DEPLOY_ENABLED == 'true' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Pin image tags to commit SHA
        working-directory: k8s
        run: |
          for svc in $(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]'); do
            img="ghcr.io/${{ github.repository_owner }}/openmarket/$svc"
            kustomize edit set image "$img=$img:${{ github.sha }}"
          done

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Apply manifests
        run: kubectl apply -k k8s/

  pr-checks:
    name: PR Checks
    needs: [detect-changes, test-unit]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Verify PR checks
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ needs.test-unit.result }}" != "success" ] && [ "${{ needs.test-unit.result }}" != "skipped" ]; then
            exit 1
          fi

  notify:
    name: Notify Results
    needs: [detect-changes, test-unit, pr-checks]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Render Pipeline Report
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          DETECT_STATUS: ${{ needs.detect-changes.result }}
          TEST_STATUS: ${{ needs.test-unit.result }}
          PR_STATUS: ${{ needs.pr-checks.result }}
          TRIGGER: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          marker() {
            case "$1" in
              success) printf "[OK]" ;;
              failure) printf "[FAIL]" ;;
              cancelled) printf "[STOP]" ;;
              skipped) printf "[SKIP]" ;;
              *) printf "[----]" ;;
            esac
          }

          if [ "$CHANGED_SERVICES" = "[]" ] || [ -z "$CHANGED_SERVICES" ]; then
            CHANGED_SERVICES="none"
          fi

          printf "\n"
          printf "========================================\n"
          printf "              CI REPORT\n"
          printf "========================================\n"
          printf "Trigger:          %s\n" "$TRIGGER"
          printf "Ref:              %s\n" "$REF_NAME"
          printf "Changed services: %s\n" "$CHANGED_SERVICES"
          printf "\n"
          printf "%-18s %s %s\n" "Detect changes" "$(marker "$DETECT_STATUS")" "$DETECT_STATUS"
          printf "%-18s %s %s\n" "Unit tests" "$(marker "$TEST_STATUS")" "$TEST_STATUS"
          printf "%-18s %s %s\n" "PR gate" "$(marker "$PR_STATUS")" "$PR_STATUS"
          printf "========================================\n"

          printf "## Marketplace CI Report\n\n" >> "$GITHUB_STEP_SUMMARY"
          printf "| Stage | Result |\n" >> "$GITHUB_STEP_SUMMARY"
          printf "| --- | --- |\n" >> "$GITHUB_STEP_SUMMARY"
          printf '| Detect changes | %s `%s` |\n' "$(marker "$DETECT_STATUS")" "$DETECT_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '| Unit tests | %s `%s` |\n' "$(marker "$TEST_STATUS")" "$TEST_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '| PR gate | %s `%s` |\n\n' "$(marker "$PR_STATUS")" "$PR_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Changed services: `%s`\n\n' "$CHANGED_SERVICES" >> "$GITHUB_STEP_SUMMARY"
          printf 'Trigger: `%s` on `%s`\n' "$TRIGGER" "$REF_NAME" >> "$GITHUB_STEP_SUMMARY"
