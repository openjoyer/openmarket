name: Marketplace CI/CD

on:
  push:
    branches: [ master, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/marketplace

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            cart-service:
              - 'services/cart-service/**'
            catalog-service:
              - 'services/catalog-service/**'
            eureka-server:
              - 'services/eureka-server/**'
            infra:
              - 'infra/**'

      - name: Set Matrix
        id: set-matrix
        run: |
          SERVICES=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"service\":$SERVICES}" >> $GITHUB_OUTPUT

  test-unit:
    name: Unit Tests - ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service != 'infra'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: matrix.service != 'infra'
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Run Unit Tests
        if: matrix.service != 'infra'
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --tests "*Test" -x "*IntegrationTest" --no-daemon

      - name: Upload Test Reports
        if: always() && matrix.service != 'infra'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          retention-days: 7

      - name: Upload Coverage Reports
        if: matrix.service != 'infra'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/jacoco/
          retention-days: 7

  test-integration:
    name: Integration Tests - ${{ matrix.service }}
    needs: [detect-changes, test-unit]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service != 'infra'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Start Docker Compose for Tests
        if: matrix.service != 'infra'
        run: |
          cd services/${{ matrix.service }}
          if [ -f docker-compose.test.yml ]; then
            docker-compose -f docker-compose.test.yml up -d
            sleep 10
          fi

      - name: Run Integration Tests
        if: matrix.service != 'infra'
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --tests "*IntegrationTest" --no-daemon || true

      - name: Stop Docker Compose
        if: always() && matrix.service != 'infra'
        run: |
          cd services/${{ matrix.service }}
          if [ -f docker-compose.test.yml ]; then
            docker-compose -f docker-compose.test.yml down -v
          fi

  build:
    name: Build - ${{ matrix.service }}
    needs: [detect-changes, test-unit, test-integration]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        if: matrix.service != 'infra'
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

  security-scan:
    name: Security Scan - ${{ matrix.service }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        if: matrix.service != 'infra'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: matrix.service != 'infra'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: [detect-changes, build, security-scan]
    if: github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.marketplace.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Example: kubectl, docker-compose, etc.

  deploy-production:
    name: Deploy to Production
    needs: [detect-changes, build, security-scan]
    if: github.ref == 'refs/heads/master' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketplace.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here

  notify:
    name: Notify Results
    needs: [test-unit, test-integration, build, security-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Notification
        run: |
          echo "Pipeline completed with status: ${{ job.status }}"
          # Add Slack/Discord/Email notification here