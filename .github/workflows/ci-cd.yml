name: Marketplace CI/CD

on:
  push:
    branches: [ master, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/marketplace

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            cart-service:
              - 'services/cart-service/**'
            catalog-service:
              - 'services/catalog-service/**'
            order-service:
              - 'services/order-service/**'
            eureka-server:
              - 'services/eureka-server/**'
            infra:
              - 'infra/**'

      - name: Set Matrix
        id: set-matrix
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Changes detected: $CHANGES"
          if [ "$CHANGES" = "[]" ] || [ -z "$CHANGES" ]; then
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"service\":$CHANGES}" >> $GITHUB_OUTPUT
          fi

  test-unit:
    name: Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service != 'infra'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: matrix.service != 'infra'
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Run Unit Tests
        if: matrix.service != 'infra'
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon

      - name: Upload Test Reports
        if: always() && matrix.service != 'infra'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          retention-days: 7

  build:
    name: Build
    needs: [detect-changes, test-unit]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: matrix.service != 'infra'
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: [detect-changes, build]
    if: github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.marketplace.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Example: kubectl, docker-compose, etc.

  deploy-production:
    name: Deploy to Production
    needs: [detect-changes, build]
    if: github.ref == 'refs/heads/master' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketplace.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here

  notify:
    name: Notify Results
    needs: [test-unit, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Notification
        run: |
          echo "Pipeline completed with status: ${{ job.status }}"