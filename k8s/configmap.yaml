apiVersion: v1
kind: ConfigMap
metadata:
  name: openmarket-config
  namespace: openmarket
data:
  SPRING_PROFILES_ACTIVE: "k8s"

  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://auth-service:9000"

  AUTH_SERVICE_URL: "http://auth-service:8080"
  CART_SERVICE_URL: "http://cart-service:8080"
  CATALOG_SERVICE_URL: "http://catalog-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8080"
