networks:
  backend:
    driver: bridge

services:
  api-gateway:
    container_name: api-gateway
    restart: unless-stopped
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - backend

  auth-service:
    container_name: auth-service
    restart: unless-stopped
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  cart-service:
    container_name: cart-service
    restart: unless-stopped
    build:
      context: ../../services/cart-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10

  catalog-service:
    container_name: catalog-service
    restart: unless-stopped
    build:
      context: ../../services/catalog-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
