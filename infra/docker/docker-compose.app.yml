  cart-service:
    container_name: cart-service
    restart: unless-stopped
    build:
      context: ../../services/cart-service
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10

