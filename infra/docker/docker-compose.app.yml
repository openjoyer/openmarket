networks:
  backend:
    driver: bridge

services:
  api-gateway:
    container_name: api-gateway
    restart: unless-stopped
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
#      auth-service:
#        condition: service_healthy
      cart-service:
        condition: service_healthy
#      catalog-service:
#        condition: service_healthy
    networks:
      - backend

